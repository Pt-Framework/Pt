<script>
    var list  = 'crypto/aes/aes.h crypto/asn1/asn1.h crypto/asn1/asn1_mac.h crypto/asn1/asn1t.h crypto/bio/bio.h crypto/bf/blowfish.h crypto/bn/bn.h crypto/buffer/buffer.h crypto/camellia/camellia.h crypto/cast/cast.h crypto/cms/cms.h crypto/comp/comp.h crypto/conf/conf_api.h crypto/conf/conf.h crypto/crypto.h crypto/des/des.h crypto/des/des_old.h crypto/dh/dh.h crypto/dsa/dsa.h crypto/dso/dso.h ssl/dtls1.h crypto/ebcdic.h crypto/ecdh/ecdh.h crypto/ecdsa/ecdsa.h crypto/ec/ec.h crypto/engine/engine.h e_os2.h crypto/err/err.h crypto/evp/evp.h crypto/hmac/hmac.h crypto/idea/idea.h crypto/krb5/krb5_asn.h ssl/kssl.h crypto/lhash/lhash.h crypto/md4/md4.h crypto/md5/md5.h crypto/mdc2/mdc2.h crypto/modes/modes.h crypto/objects/objects.h crypto/objects/obj_mac.h crypto/ocsp/ocsp.h crypto/opensslconf.h crypto/opensslv.h crypto/ossl_typ.h crypto/pem/pem2.h crypto/pem/pem.h crypto/pkcs12/pkcs12.h crypto/pkcs7/pkcs7.h crypto/pqueue/pqueue.h crypto/rand/rand.h crypto/rc2/rc2.h crypto/rc4/rc4.h crypto/ripemd/ripemd.h crypto/rsa/rsa.h crypto/stack/safestack.h crypto/seed/seed.h crypto/sha/sha.h ssl/ssl23.h ssl/ssl2.h ssl/ssl3.h ssl/ssl.h crypto/stack/stack.h crypto/symhacks.h ssl/tls1.h crypto/ts/ts.h crypto/txt_db/txt_db.h crypto/ui/ui_compat.h crypto/ui/ui.h crypto/whrlpool/whrlpool.h crypto/x509/x509.h crypto/x509v3/x509v3.h crypto/x509/x509_vfy.h';
    var files = list.split(' ');

    var ltoks = [], ltokmlen = 0;
    var rtoks = [], rtokmlen = 0;;

    for(var i = 0; i < files.length; ++i) {
        var parts = files[i].split('/');
        var last  = parts[parts.length - 1];
        var ltok  = '$(TOP) src Pt-Ssl openssl include openssl ' + last;
        var rtok  = '$(TOP) src Pt-Ssl openssl ';
        for(var j = 0; j < parts.length; ++j) rtok += parts[j] + ' ';
        ltoks.push(ltok);
        rtoks.push(rtok);
        if(ltok.length >  ltokmlen) ltokmlen = ltok.length;
        if(rtok.length >  rtokmlen) rtokmlen = rtok.length;
    }

    for(var i = 0; i < ltoks.length; ++i) {
        var cnt = ltokmlen - ltoks[i].length;
        for(var j = 0; j < cnt; ++j) ltoks[i] += ' ';
    }
    for(var i = 0; i < rtoks.length; ++i) {
        var cnt = rtokmlen - rtoks[i].length;
        for(var j = 0; j < cnt; ++j) rtoks[i] += ' ';
    }

    document.write('<pre>');
    for(var i = 0; i < ltoks.length; ++i) {
        document.write('File [ FDirName ' + ltoks[i] + ' ] : [ FDirName ' + rtoks[i] + ' ] ;\n');
    }
    document.write('</pre>');

</script>
