<!-- plain (without DTD); without size; with view-box -->

<!-- the coordinates should be scaled to fit the screen size and then aligned to the top-left of the screen -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 319 239" preserveAspectRatio="none">
    <!-- direct -->
    <line x1="5" y1="5" x2="100" y2="100" stroke="green" stroke-width="8"/>
</svg>
