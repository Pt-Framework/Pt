<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">

<!-- with DTD; without size; without view-box -->

<!-- the coordinates should be rendered as is and then aligned to the top-left of the screen -->

<svg xmlns="http://www.w3.org/2000/svg">
    <!-- direct -->
    <line x1="5" y1="5" x2="100" y2="100" stroke="green" stroke-width="8"/>
</svg>
