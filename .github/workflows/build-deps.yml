name: Build Pt Dependencies
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code'
        required: false
        default: '1'
        type: string
      replace:
        description: 'Replace existing'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      DEPS_EXPORT_DIR: ${{ github.workspace }}/exported
      DEPS_BASENAME: pt-deps
      DEPS_TAG: deps-${{ inputs.versionCode }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Check tag does not exist
        if: ${{ !inputs.replace }}
        shell: pwsh
        run: |
          gh release view "${{ env.DEPS_TAG }}" 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release ${{ env.DEPS_TAG }} already exists. Increment versionCode or enable replace."
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup vcpkg tools
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          vcpkgGitCommitId: 'c3867e714dd3a51c272826eea77267876517ed99'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg' 

      - name: Install packages
        shell: pwsh
        run: >
          vcpkg install
          --triplet=${{ matrix.triplet }}
          --x-install-root="${{ env.VCPKG_INSTALLED_DIR }}"

      - name: Create archive
        shell: pwsh
        run: |
          $src = "${{ env.VCPKG_INSTALLED_DIR }}/${{ matrix.triplet }}"
          $zip = "${{ env.DEPS_EXPORT_DIR }}/${{ env.DEPS_BASENAME }}-${{ matrix.triplet }}.zip"
          New-Item -ItemType Directory -Force -Path "${{ env.DEPS_EXPORT_DIR }}" | Out-Null
          Compress-Archive -Path $src -DestinationPath $zip

      - name: Create manifest
        shell: pwsh
        run: |
          $zip = "${{ env.DEPS_EXPORT_DIR }}/${{ env.DEPS_BASENAME }}-${{ matrix.triplet }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $manifest = "$zip.manifest"
          @(
            "VersionCode: ${{ inputs.versionCode }}"
            "Sha256: $hash"
            "VcpkgCommit: c3867e714dd3a51c272826eea77267876517ed99"
            "Date: $(Get-Date -Format 'yyyy-MM-dd')"
          ) -join "`n" | Out-File -FilePath $manifest -Encoding utf8 -NoNewline
          
      - name: Release packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEPS_TAG }}
          name: "Pt Dependencies (${{ env.DEPS_TAG }})"
          body: Precompiled dependencies (libpng, freetype) for Pt
          files: ${{ env.DEPS_EXPORT_DIR }}/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
