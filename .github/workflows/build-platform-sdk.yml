name: Build Platform SDK

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code'
        required: false
        default: '1'
        type: string
      replace:
        description: 'Replace existing'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: x64-windows
            profile: conan/platform-sdk/profiles/windows-msvc2022-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      PLATFORM_SDK_TAG: platform-sdk-${{ inputs.versionCode }}
      PLATFORM_SDK_BASENAME: pt-platform-sdk
      EXPORT_DIR: ${{ github.workspace }}/deploy
      DEPLOY_DIR: ${{ github.workspace }}/deploy/${{ matrix.platform }}
      LOCKFILE: ${{ github.workspace }}/conan/platform-sdk/conan.lock

    steps:
      - uses: actions/checkout@v6

      - name: Check tag does not exist
        if: ${{ !inputs.replace }}
        shell: pwsh
        run: |
          gh release view "${{ env.PLATFORM_SDK_TAG }}" 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release ${{ env.PLATFORM_SDK_TAG }} already exists. Increment versionCode or enable replace."
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup Perl
        run: choco install strawberryperl --no-progress -y

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('conan/platform-sdk/conan.lock', 'conan/platform-sdk/conanfile.py', 'conan/platform-sdk/profiles/**') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.platform }}-

      - name: Create lockfile if missing
        shell: pwsh
        run: |
          $lock = "${{ env.LOCKFILE }}"
          $profile = "${{ matrix.profile }}"
          $recipe = "conan/platform-sdk"
          if (-not (Test-Path $lock)) {
            conan lock create $recipe --profile=$profile -s build_type=Release -s compiler.runtime_type=Release --lockfile-out=$lock
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            conan lock create $recipe --profile=$profile -s build_type=Debug -s compiler.runtime_type=Debug --lockfile=$lock --lockfile-out=$lock
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Release
        run: >
          conan install conan/platform-sdk
          --profile=${{ matrix.profile }}
          --lockfile=${{ env.LOCKFILE }}
          -s build_type=Release
          -s compiler.runtime_type=Release
          --build=missing
          --deployer=full_deploy
          --deployer-folder=${{ env.DEPLOY_DIR }}
          --output-folder=${{ env.DEPLOY_DIR }}

      - name: Install Debug
        run: >
          conan install conan/platform-sdk
          --profile=${{ matrix.profile }}
          --lockfile=${{ env.LOCKFILE }}
          -s build_type=Debug
          -s compiler.runtime_type=Debug
          --build=missing
          --deployer=full_deploy
          --deployer-folder=${{ env.DEPLOY_DIR }}
          --output-folder=${{ env.DEPLOY_DIR }}

      - name: Collect jam files
        shell: pwsh
        run: |
          $out = "${{ env.DEPLOY_DIR }}"
          Get-ChildItem -Path $out -Recurse -Filter "platform-sdk-*.jam" |
            ForEach-Object {
              if ($_.DirectoryName -ne (Resolve-Path $out).Path) {
                Copy-Item $_.FullName -Destination $out -Force
              }
            }
          Get-ChildItem -Path $out -File | Where-Object { $_.Name -notmatch '^platform-sdk-.*\.jam$' } | Remove-Item
          Get-ChildItem -Path $out -Directory | Where-Object { $_.Name -ne 'full_deploy' } | Remove-Item -Recurse -Force

      - name: Assert platform-sdk layout
        shell: pwsh
        run: |
          $out = "${{ env.DEPLOY_DIR }}"
          $hostDir = Join-Path $out "full_deploy\host"
          $required = @("zlib", "libpng", "libjpeg-turbo", "freetype", "openssl")
          foreach ($pkg in $required) {
            $pkgDir = Join-Path $hostDir $pkg
            if (-not (Test-Path $pkgDir)) {
              Write-Error "Missing package in full_deploy/host: $pkg"
              exit 1
            }
          }
          $transitive = @("brotli", "bzip2")
          $foundTransitive = $false
          foreach ($pkg in $transitive) {
            if (Test-Path (Join-Path $hostDir $pkg)) { $foundTransitive = $true }
          }
          if (-not $foundTransitive) {
            Write-Error "Missing transitive package (brotli or bzip2) in full_deploy/host"
            exit 1
          }
          foreach ($cfg in @("Release", "Debug")) {
            $cfgPath = Get-ChildItem -Path (Join-Path $hostDir "zlib") -Recurse -Directory -Filter $cfg | Select-Object -First 1
            if (-not $cfgPath) {
              Write-Error "Missing $cfg tree under zlib"
              exit 1
            }
          }
          foreach ($name in @("platform-sdk-release.jam", "platform-sdk-debug.jam")) {
            $jam = Join-Path $out $name
            if (-not (Test-Path $jam)) {
              Write-Error "Missing $name"
              exit 1
            }
            $text = Get-Content $jam -Raw
            if ($text -notmatch "PLATFORM_SDK_ROOT") {
              Write-Error "$name does not use PLATFORM_SDK_ROOT"
              exit 1
            }
            if ($text -match "\.conan2|D:\\a\\|C:/Users/") {
              Write-Error "$name contains an absolute CI or cache path"
              exit 1
            }
          }

      - name: Create archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.EXPORT_DIR }}" | Out-Null
          $zip = "${{ env.EXPORT_DIR }}/${{ env.PLATFORM_SDK_BASENAME }}-${{ matrix.platform }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "${{ env.DEPLOY_DIR }}" -DestinationPath $zip

      - name: Create manifest
        shell: pwsh
        run: |
          $zip = "${{ env.EXPORT_DIR }}/${{ env.PLATFORM_SDK_BASENAME }}-${{ matrix.platform }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          $hostDir = Join-Path "${{ env.DEPLOY_DIR }}" "full_deploy\host"
          $packages = @()
          Get-ChildItem $hostDir -Directory | ForEach-Object {
            $verDir = Get-ChildItem $_.FullName -Directory | Select-Object -First 1
            if ($verDir) {
              $packages += "$($_.Name)/$($verDir.Name)"
            } else {
              $packages += $_.Name
            }
          }
          $manifest = "$zip.manifest"
          $lines = @(
            "Version: ${{ env.PLATFORM_SDK_TAG }}"
            "Sha256: $hash"
            "Date: $(Get-Date -Format 'yyyy-MM-dd')"
            "Platform: ${{ matrix.platform }}"
            "Compiler: msvc 193"
            "Runtime: MD/MDd"
            "Shared: true"
            "Packages:"
          )
          $lines += $packages
          $lines -join "`n" | Out-File -FilePath $manifest -Encoding utf8 -NoNewline
          Copy-Item "${{ env.LOCKFILE }}" "${{ env.EXPORT_DIR }}/conan.lock" -Force

      - name: Release packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.PLATFORM_SDK_TAG }}
          name: "Pt platform-sdk (${{ env.PLATFORM_SDK_TAG }})"
          body: Precompiled platform-sdk (zlib, libpng, libjpeg-turbo, freetype, openssl)
          files: |
            ${{ env.EXPORT_DIR }}/${{ env.PLATFORM_SDK_BASENAME }}-${{ matrix.platform }}.zip
            ${{ env.EXPORT_DIR }}/${{ env.PLATFORM_SDK_BASENAME }}-${{ matrix.platform }}.zip.manifest
            ${{ env.EXPORT_DIR }}/conan.lock
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
